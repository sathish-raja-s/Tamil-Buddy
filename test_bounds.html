<!DOCTYPE html>
<html>
<head>
<style>
  .wrapper {
    position: relative;
    display: inline-block;
    font-size: 200px;
    font-family: sans-serif;
    font-weight: bold;
    color: #cbd5e1;
    background: #f8fafc;
  }
  .start {
    position: absolute;
    top: 10%;
    left: 0%;
    width: 20px;
    height: 20px;
    background: green;
    border-radius: 50%;
  }
  .end {
    position: absolute;
    bottom: 10%;
    right: 0%;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <div class="wrapper">
    அ
    <div class="start"></div>
    <div class="end"></div>
  </div>
</body>
</html>
